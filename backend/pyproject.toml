[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civicloop"
version = "0.1.0"
description = "Persistence layer for CivicLoopAI"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

storage = [
    "boto3>=1.34",
]

ai = [
    "google-genai>=1.0",
]

queue = [
    "redis>=5.0",
]

postgres = [
    "psycopg[binary]>=3.1",
]

migrations = [
    "alembic>=1.13",
]

ml = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "ortools>=9.9",
    "fastembed>=0.3",
]

api = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["civicloop*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
