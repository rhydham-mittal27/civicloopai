name: Android release APKs

# Builds the two phone apps (CivicLoop for residents, CivicLoop Crew for drivers) as installable release APKs.
# Start it from the Actions tab (Run workflow) or by pushing a change under mobile/.
# Watch the steps live on the Actions page; the finished APKs appear at the bottom of the run as downloads.
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apks.yml"

permissions:
  contents: write

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [crew, resident]
    env:
      # Where the app finds its server. Change it by adding a repository variable called API_URL.
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://civicloopai.onrender.com' }}
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept the Android SDK licences (the SDK itself is already on the machine)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (with a download cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install the JavaScript packages
        working-directory: mobile
        run: npm ci

      - name: Generate the native Android project
        working-directory: mobile/apps/${{ matrix.app }}
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: mobile/apps/${{ matrix.app }}/android
        # arm64-v8a is what nearly every current Android phone uses. Add a repository variable ABIS
        # (for example arm64-v8a,armeabi-v7a) to include older 32-bit phones; it makes the build longer.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=${{ vars.ABIS || 'arm64-v8a' }} --console=plain

      - name: Name the APK
        run: |
          apk=$(ls mobile/apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "civicloop-${{ matrix.app }}-release.apk"
          echo "### ${{ matrix.app }}: $(du -h "civicloop-${{ matrix.app }}-release.apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed with the standard debug key, so it installs on a phone. Use your own release key before publishing to the Play Store." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: civicloop-${{ matrix.app }}-release-apk
          path: civicloop-${{ matrix.app }}-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the APK for direct download (no GitHub sign-in needed)
        # Both apps attach to one public release called apk-latest, so the monitor page can link straight to the file.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Latest phone apps" --notes "Newest CivicLoop and CivicLoop Crew APKs, rebuilt on every change under mobile/." --prerelease || gh release view apk-latest >/dev/null
          gh release upload apk-latest "civicloop-${{ matrix.app }}-release.apk" --clobber
