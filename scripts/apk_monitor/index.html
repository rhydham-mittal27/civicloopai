<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap">
<style>
  :root {
    --bg: #020a12;
    --bg2: #04131f;
    --cyan: #00e5ff;
    --cyan-dim: #0a8fa3;
    --cyan-faint: rgba(0, 229, 255, 0.14);
    --amber: #ffb300;
    --red: #ff3d57;
    --green: #2dffb0;
    --ink: #bff7ff;
    --mute: #5aa5b3;
    --display: "Orbitron", "Segoe UI", system-ui, sans-serif;
    --mono: "Share Tech Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  body {
    background:
      radial-gradient(1200px 700px at 50% -10%, #08324a 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 100%, #052a3a 0%, transparent 55%),
      var(--bg);
    overflow-x: hidden;
  }
  /* moving grid and a slow scan line, behind everything */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(var(--cyan-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan-faint) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%);
    animation: drift 24s linear infinite;
  }
  body::after {
    content: ""; position: fixed; left: 0; right: 0; height: 140px; top: -140px; pointer-events: none; z-index: 1;
    background: linear-gradient(180deg, transparent, rgba(0, 229, 255, 0.08), transparent);
    animation: scan 7s linear infinite;
  }
  @keyframes drift { to { background-position: 48px 48px; } }
  @keyframes scan { to { transform: translateY(calc(100vh + 280px)); } }

  .shell { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 22px 22px 40px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--cyan-faint); }
  .brand { font-family: var(--display); font-weight: 900; letter-spacing: 0.32em; font-size: 15px; color: var(--cyan); text-shadow: 0 0 14px rgba(0, 229, 255, 0.7); }
  .brand small { display: block; font-family: var(--mono); font-weight: 400; letter-spacing: 0.18em; font-size: 11px; color: var(--mute); margin-top: 4px; text-shadow: none; }
  .clock { text-align: right; font-size: 13px; color: var(--mute); letter-spacing: 0.12em; }
  .clock b { display: block; font-family: var(--display); font-size: 20px; color: var(--ink); letter-spacing: 0.14em; }
  .link { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.6s ease-in-out infinite; }
  .dot.off { background: var(--red); box-shadow: 0 0 10px var(--red); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* the central "reactor" */
  .core { display: grid; place-items: center; padding: 26px 0 8px; }
  .reactor { position: relative; width: min(360px, 78vw); aspect-ratio: 1; }
  .reactor svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .spin-a { transform-origin: 50% 50%; animation: spin 38s linear infinite; }
  .spin-b { transform-origin: 50% 50%; animation: spin 22s linear infinite reverse; }
  .spin-c { transform-origin: 50% 50%; animation: spin 60s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .readout { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .readout .pct { font-family: var(--display); font-weight: 900; font-size: clamp(46px, 11vw, 78px); color: #fff; text-shadow: 0 0 22px rgba(0, 229, 255, 0.85); line-height: 1; }
  .readout .pct sup { font-size: 0.38em; color: var(--cyan); margin-left: 4px; }
  .readout .cap { font-size: 12px; letter-spacing: 0.3em; color: var(--mute); margin-top: 10px; }
  .readout .eta { font-size: 13px; color: var(--amber); margin-top: 8px; letter-spacing: 0.1em; min-height: 18px; }
  #arc { transition: stroke-dashoffset 0.9s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.9)); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-top: 18px; }

  .panel {
    position: relative; padding: 20px 20px 18px; background: linear-gradient(180deg, rgba(5, 36, 52, 0.78), rgba(3, 18, 28, 0.82));
    border: 1px solid var(--cyan-faint); backdrop-filter: blur(4px);
    clip-path: polygon(0 14px, 14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px));
  }
  .panel::before, .panel::after { content: ""; position: absolute; width: 20px; height: 20px; border: 2px solid var(--cyan); opacity: 0.85; }
  .panel::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }

  .ptitle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ptitle h2 { margin: 0; font-family: var(--display); font-size: 15px; letter-spacing: 0.22em; color: var(--cyan); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
  .badge { font-size: 11px; letter-spacing: 0.2em; padding: 4px 10px; border: 1px solid currentColor; }
  .badge.waiting { color: var(--mute); }
  .badge.running { color: var(--cyan); box-shadow: 0 0 12px rgba(0, 229, 255, 0.35) inset; animation: pulse 1.8s ease-in-out infinite; }
  .badge.done { color: var(--green); box-shadow: 0 0 12px rgba(45, 255, 176, 0.35) inset; }
  .badge.failed { color: var(--red); box-shadow: 0 0 12px rgba(255, 61, 87, 0.35) inset; }

  .bar { margin: 16px 0 6px; height: 12px; border: 1px solid var(--cyan-dim); position: relative; background: rgba(0, 229, 255, 0.05); }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(110deg, var(--cyan) 0 8px, #5cf0ff 8px 14px); box-shadow: 0 0 14px rgba(0, 229, 255, 0.8); transition: width 0.9s cubic-bezier(.2,.8,.2,1); }
  .bar.done i { background: repeating-linear-gradient(110deg, var(--green) 0 8px, #8bffd3 8px 14px); box-shadow: 0 0 14px rgba(45, 255, 176, 0.8); }
  .bar.failed i { background: var(--red); box-shadow: 0 0 14px rgba(255, 61, 87, 0.8); }
  .barline { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); letter-spacing: 0.1em; }
  .barline b { color: var(--ink); font-weight: 400; }

  .stages { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 7px; }
  .stages li { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--mute); }
  .stages .pip { width: 14px; height: 14px; border: 1px solid var(--cyan-dim); transform: rotate(45deg); flex: none; }
  .stages li.done { color: var(--ink); }
  .stages li.done .pip { background: var(--green); border-color: var(--green); box-shadow: 0 0 10px var(--green); }
  .stages li.active { color: #fff; }
  .stages li.active .pip { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: pulse 1.2s ease-in-out infinite; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .stat { border: 1px solid var(--cyan-faint); padding: 9px 10px; background: rgba(0, 0, 0, 0.18); }
  .stat span { display: block; font-size: 10px; letter-spacing: 0.22em; color: var(--mute); }
  .stat b { display: block; margin-top: 5px; font-family: var(--display); font-weight: 500; font-size: 18px; color: var(--ink); letter-spacing: 0.06em; }

  .feed { margin-top: 14px; padding: 10px 12px; height: 128px; overflow: hidden; border-left: 2px solid var(--cyan-dim); background: rgba(0, 0, 0, 0.28); font-size: 11.5px; line-height: 1.55; color: #7fd6e4; }
  .feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.55; }
  .feed div:last-child { opacity: 1; color: #fff; }
  .feed div:last-child::after { content: "\2588"; margin-left: 4px; animation: pulse 1s steps(1) infinite; color: var(--cyan); }

  .note { margin-top: 10px; font-size: 12px; color: var(--amber); min-height: 17px; }
  .error { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--red); color: #ffc0c9; font-size: 12px; line-height: 1.5; }

  .apk { margin-top: 14px; padding: 14px; border: 1px solid var(--green); background: rgba(45, 255, 176, 0.06); display: none; }
  .apk.show { display: block; animation: rise 0.6s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .apk h3 { margin: 0 0 6px; font-family: var(--display); font-size: 13px; letter-spacing: 0.2em; color: var(--green); }
  .apk p { margin: 4px 0; font-size: 12.5px; color: var(--ink); word-break: break-all; }
  .apk a { display: inline-block; margin-top: 8px; padding: 9px 16px; font-family: var(--display); font-size: 12px; letter-spacing: 0.2em; color: #00110b; background: var(--green); text-decoration: none; box-shadow: 0 0 16px rgba(45, 255, 176, 0.6); }
  .apk a:hover { filter: brightness(1.12); }

  footer { margin-top: 26px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 11px; letter-spacing: 0.18em; color: var(--mute); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">J.A.R.V.I.S // BUILD CONTROL<small>CIVICLOOP ANDROID RELEASE PIPELINE</small></div>
    <div class="clock"><b id="clock">--:--:--</b><span class="link"><span class="dot" id="linkdot"></span><span id="linktext">LINK ESTABLISHING</span></span></div>
  </header>

  <section class="core">
    <div class="reactor">
      <svg viewBox="0 0 400 400" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#2dffb0"/></linearGradient>
        </defs>
        <g class="spin-c" fill="none" stroke="#0a8fa3" stroke-width="1">
          <circle cx="200" cy="200" r="190" stroke-dasharray="2 9"/>
          <circle cx="200" cy="200" r="178" stroke-opacity="0.5"/>
        </g>
        <g class="spin-a" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round">
          <circle cx="200" cy="200" r="164" stroke-dasharray="70 28 14 28" stroke-opacity="0.65"/>
        </g>
        <g class="spin-b" fill="none" stroke="#00e5ff" stroke-width="1.5">
          <circle cx="200" cy="200" r="146" stroke-dasharray="4 6" stroke-opacity="0.8"/>
          <path d="M200 40 L200 60 M200 340 L200 360 M40 200 L60 200 M340 200 L360 200" stroke-width="3"/>
        </g>
        <circle cx="200" cy="200" r="128" fill="none" stroke="#0a8fa3" stroke-opacity="0.35" stroke-width="10"/>
        <circle id="arc" cx="200" cy="200" r="128" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"
                stroke-dasharray="804.25" stroke-dashoffset="804.25" transform="rotate(-90 200 200)"/>
        <circle cx="200" cy="200" r="104" fill="rgba(0,229,255,0.04)" stroke="#00e5ff" stroke-opacity="0.35"/>
      </svg>
      <div class="readout">
        <div>
          <div class="pct"><span id="overall">0</span><sup>%</sup></div>
          <div class="cap">TOTAL PROGRESS</div>
          <div class="eta" id="eta"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="grid" id="panels"></section>

  <footer>
    <span>REFRESH 2 S</span>
    <span id="source"></span>
    <span id="host"></span>
    <span>ARM64 // RELEASE // HTTPS BACKEND</span>
  </footer>
</div>

<script>
const $ = (selector, root = document) => root.querySelector(selector);
const panels = $("#panels");
const built = {};
let lastOk = 0;

function pad(n) { return String(n).padStart(2, "0"); }
function duration(seconds) {
  const s = Math.max(0, Math.round(seconds));
  return s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}` : `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
}

function panelFor(app) {
  if (built[app.name]) return built[app.name];
  const el = document.createElement("article");
  el.className = "panel";
  el.innerHTML = `
    <div class="ptitle"><h2>${app.title}</h2><span class="badge waiting">STANDBY</span></div>
    <div class="bar"><i></i></div>
    <div class="barline"><span class="stage">--</span><b class="pct">0%</b></div>
    <ul class="stages"></ul>
    <div class="stats">
      <div class="stat"><span>TASKS</span><b class="tasks">0</b></div>
      <div class="stat"><span>ELAPSED</span><b class="elapsed">00:00</b></div>
      <div class="stat"><span>LAST SIGNAL</span><b class="idle">0s</b></div>
    </div>
    <div class="feed"></div>
    <div class="note"></div>
    <div class="error" hidden></div>
    <div class="apk"><h3>PAYLOAD READY</h3><p class="apkinfo"></p><p class="apkurl"></p><a class="apkdl" href="#">DOWNLOAD APK</a></div>`;
  panels.appendChild(el);
  built[app.name] = el;
  return el;
}

const BADGE = { waiting: "STANDBY", running: "BUILDING", done: "COMPLETE", failed: "FAULT" };

function render(app, host) {
  const el = panelFor(app);
  const badge = $(".badge", el);
  badge.className = `badge ${app.state}`;
  badge.textContent = BADGE[app.state] || app.state.toUpperCase();
  const bar = $(".bar", el);
  bar.className = `bar ${app.state === "done" ? "done" : app.state === "failed" ? "failed" : ""}`;
  $("i", bar).style.width = `${app.percent}%`;
  $(".stage", el).textContent = app.stage.toUpperCase();
  $(".pct", el).textContent = `${app.percent}%`;
  $(".stages", el).innerHTML = (app.stages.length ? app.stages : []).map((s) => `<li class="${s.state}"><span class="pip"></span>${s.label}</li>`).join("");
  $(".tasks", el).textContent = app.tasks;
  $(".elapsed", el).textContent = duration(app.elapsed);
  $(".idle", el).textContent = app.state === "running" ? `${app.idle}s` : "--";
  const feed = $(".feed", el);
  feed.innerHTML = app.feed.map((line) => `<div>${line.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</div>`).join("");
  $(".note", el).textContent = app.note || "";
  const error = $(".error", el);
  error.hidden = !app.error;
  error.textContent = app.error ? `FAULT: ${app.error}` : "";
  const apk = $(".apk", el);
  apk.classList.toggle("show", !!app.apk);
  if (app.apk) {
    $(".apkinfo", el).textContent = `${app.apk.file}${app.apk.mb ? `  //  ${app.apk.mb} MB` : ""}`;
    $(".apkurl", el).textContent = `On a phone on this Wi-Fi: ${host}${app.apk.url}`;
    $(".apkdl", el).href = app.apk.url;
  }
}

function setOverall(apps) {
  const value = apps.length ? apps.reduce((sum, app) => sum + app.percent, 0) / apps.length : 0;
  const rounded = Math.round(value);
  $("#overall").textContent = rounded;
  const circumference = 804.25;
  $("#arc").style.strokeDashoffset = circumference * (1 - value / 100);

  // a rough time estimate from how far it has come and how long that took
  const running = apps.filter((a) => a.state === "running");
  const eta = $("#eta");
  const allDone = apps.length && apps.every((a) => a.state === "done");
  if (allDone) eta.textContent = "ALL SYSTEMS NOMINAL";
  else if (apps.some((a) => a.state === "failed")) eta.textContent = "FAULT DETECTED";
  else if (running.length && value > 8) {
    const elapsed = Math.max(...running.map((a) => a.elapsed));
    const remaining = (elapsed / value) * (100 - value);
    eta.textContent = `ETA ~ ${Math.max(1, Math.round(remaining / 60))} MIN (ROUGH)`;
  } else eta.textContent = "";
}

async function tick() {
  try {
    const response = await fetch("/status", { cache: "no-store" });
    const data = await response.json();
    lastOk = Date.now();
    data.apps.forEach((app) => render(app, data.host));
    setOverall(data.apps);
    $("#host").textContent = `LAN ${data.host}`;
    $("#source").textContent = `SOURCE: ${data.source}`;
  } catch (error) {
    /* the link light below shows it */
  }
  const online = Date.now() - lastOk < 6000;
  $("#linkdot").classList.toggle("off", !online);
  $("#linktext").textContent = online ? "LINK ACTIVE" : "LINK LOST";
}

setInterval(() => { $("#clock").textContent = new Date().toLocaleTimeString("en-GB"); }, 500);
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
