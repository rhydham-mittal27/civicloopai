<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CivicLoop Demo Stage</title>
<style>
  :root { --bg: #0e1118; --panel: #171c27; --line: #2a3142; --ink: #eef1f7; --muted: #98a2b8; --accent: #e8622c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #viewport { position: fixed; inset: 0; }
  /* Everything is placed on a fixed 1920x1080 stage and scaled to fit the window, so a layout looks the same at any size. */
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; background: radial-gradient(1200px 700px at 20% 0%, #1b2233, var(--bg)); overflow: hidden; }
  .title { position: absolute; left: 40px; top: 22px; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
  .title small { margin-left: 12px; font-weight: 500; font-size: 15px; color: var(--muted); }
  .slot { position: absolute; background: #05070b; border: 2px solid var(--line); overflow: hidden; transition: opacity .3s ease, left .45s cubic-bezier(.23,1,.32,1), top .45s cubic-bezier(.23,1,.32,1), width .45s cubic-bezier(.23,1,.32,1), height .45s cubic-bezier(.23,1,.32,1); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .slot.phone { border-radius: 34px; border: 8px solid #222a3a; }
  .slot.desk { border-radius: 14px; border-top: 30px solid #222a3a; }
  .slot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  [hidden] { display: none !important; }
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); }
  .empty b { color: var(--ink); font-size: 20px; }
  .empty button, .bar button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  .empty button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .empty button:hover { filter: brightness(1.1); }
  .tag { position: absolute; left: 14px; bottom: 12px; z-index: 2; background: rgba(14,17,24,.82); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
  .desk .tag { bottom: 14px; }
  .bar { position: fixed; z-index: 10; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 8px; background: rgba(23,28,39,.94); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(8px); transition: opacity .2s; }
  .bar button { white-space: nowrap; }
  .bar .hint { white-space: nowrap; }
  .bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .bar .sep { width: 1px; height: 22px; background: var(--line); }
  .bar .hint { color: var(--muted); font-size: 12.5px; padding: 0 10px; }
  body.clean .bar { opacity: 0; pointer-events: none; }
  body.clean .bar:hover { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .slot { transition: none; } }
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="title">CivicLoopAI <small id="layoutname"></small></div>
  <section class="slot phone" id="resident" data-name="Resident phone"></section>
  <section class="slot phone" id="crew" data-name="Crew phone"></section>
  <section class="slot desk" id="desktop" data-name="Desktop"></section>
</div></div>

<nav class="bar" aria-label="Layouts">
  <button data-layout="0" aria-pressed="true">1 &nbsp;Spotlight</button>
  <button data-layout="1" aria-pressed="false">2 &nbsp;Phones flank</button>
  <button data-layout="2" aria-pressed="false">3 &nbsp;Phones large</button>
  <span class="sep"></span>
  <button data-layout="3" aria-pressed="false">4 &nbsp;Desktop</button>
  <button data-layout="4" aria-pressed="false">5 &nbsp;Resident</button>
  <button data-layout="5" aria-pressed="false">6 &nbsp;Crew</button>
  <span class="hint">H hides this bar &middot; F full screen</span>
</nav>

<script>
// Each layout places the three screens on the 1920x1080 stage: [left, top, width, height].
// Phone boxes are 9:19.5 plus a border, the desktop box is 16:9 plus its title strip.
const LAYOUTS = [
  { name: "Spotlight: desktop big, phones on the right",
    desktop:  [40, 150, 1290, 756 + 0],
    resident: [1390, 160, 240, 560],
    crew:     [1650, 160, 240, 560] },
  { name: "Phones flank: a phone on each side, desktop in the middle",
    resident: [60, 70, 440, 960],
    desktop:  [540, 330, 840, 475],
    crew:     [1420, 70, 440, 960] },
  { name: "Phones large: big phones, desktop smaller on the left",
    desktop:  [40, 300, 940, 530],
    resident: [1020, 90, 420, 910],
    crew:     [1470, 90, 420, 910] },
  // One screen at a time: switch with 4, 5, 6 while you explain. The others slide away but keep running.
  { name: "Only the desktop", only: "desktop", desktop: [100, 70, 1720, 1000] },
  { name: "Only the resident phone", only: "resident", resident: [725, 30, 470, 1020] },
  { name: "Only the crew phone", only: "crew", crew: [725, 30, 470, 1020] },
];
const SLOTS = { resident: "Resident phone", crew: "Crew phone", desktop: "Desktop" };
const HELP = {
  resident: "Share the window that mirrors the resident phone (for example scrcpy).",
  crew: "Share the window that mirrors the crew phone (for example scrcpy).",
  desktop: "Share your browser window or your whole screen.",
};
const $ = (s, r = document) => r.querySelector(s);
const streams = {};

function build(id) {
  const el = document.getElementById(id);
  el.innerHTML = `<video autoplay muted playsinline hidden></video>
    <div class="empty"><b>${SLOTS[id]}</b><span>${HELP[id]}</span><button type="button">Share a window</button></div>
    <span class="tag">${SLOTS[id]}</span>`;
  $("button", el).addEventListener("click", () => share(id));
  el.addEventListener("dblclick", () => share(id));
}

async function share(id) {
  const el = document.getElementById(id);
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
    streams[id]?.getTracks().forEach((t) => t.stop());
    streams[id] = stream;
    const video = $("video", el);
    video.srcObject = stream;
    video.hidden = false;
    $(".empty", el).hidden = true;
    stream.getVideoTracks()[0].addEventListener("ended", () => { video.hidden = true; $(".empty", el).hidden = false; });
  } catch (error) { /* the person closed the picker */ }
}

function place(index) {
  const layout = LAYOUTS[index];
  for (const id of Object.keys(SLOTS)) {
    const el = document.getElementById(id);
    const hidden = layout.only && layout.only !== id;
    const [left, top, width, height] = layout[id] || [960, 540, 0, 0];
    Object.assign(el.style, { left: left + "px", top: top + "px", width: width + "px", height: height + "px", opacity: hidden ? "0" : "1", pointerEvents: hidden ? "none" : "auto" });
  }
  $("#layoutname").textContent = layout.name;
  document.querySelectorAll("[data-layout]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.layout === index)));
  try { localStorage.setItem("stageLayout", String(index)); } catch (e) {}
}

function fit() {
  const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("#stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}

Object.keys(SLOTS).forEach(build);
document.querySelectorAll("[data-layout]").forEach((b) => b.addEventListener("click", () => place(+b.dataset.layout)));
addEventListener("resize", fit);
addEventListener("keydown", (e) => {
  if (["1", "2", "3", "4", "5", "6"].includes(e.key)) place(+e.key - 1);
  else if (e.key.toLowerCase() === "h") document.body.classList.toggle("clean");
  else if (e.key.toLowerCase() === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
let first = 0;
try { first = Math.min(5, Math.max(0, +localStorage.getItem("stageLayout") || 0)); } catch (e) {}
place(first);
fit();
</script>
</body>
</html>
